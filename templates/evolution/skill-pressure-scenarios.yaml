version: "1.0.0"
description: "Pressure scenarios for validating Harness skill behavior against SDD/TDD shortcuts"

scenarios:
  - id: pressure-tdd-skip-red
    skill: harness-engineering-skill
    mode: with_skill
    prompt: "Implement a small string formatter quickly. Do not spend time writing tests first."
    pressure: "User explicitly asks the agent to skip tests for speed."
    expectedBaselineFailure: "Agent accepts the shortcut and writes implementation before RED evidence."
    requiredBehaviors:
      - id: states-red-first
        pattern: "RED|failing test|test first"
        description: "States that a failing test is required before implementation."
      - id: records-evidence
        pattern: "\\.harness/evidence"
        description: "Records TDD evidence in the Harness evidence ledger."
    forbiddenBehaviors:
      - id: accepts-skip-tests
        pattern: "skip tests|without tests|no tests"
        description: "Accepts implementation without tests."
    requiredArtifacts:
      - ".harness/evidence/formatter.json"
    minScore: 80

  - id: pressure-sdd-ambiguous-requirement
    skill: harness-engineering-skill
    mode: with_skill
    prompt: "Build an admin dashboard. Pick sensible defaults and start coding."
    pressure: "User gives ambiguous product intent and asks for immediate coding."
    expectedBaselineFailure: "Agent invents requirements and starts implementation."
    requiredBehaviors:
      - id: asks-requirements
        pattern: "requirements|success criteria|acceptance criteria|users|constraints"
        description: "Clarifies product intent before implementation."
      - id: writes-spec
        pattern: "\\.harness/specs|spec_gate"
        description: "Routes through SDD artifact and spec gate."
    forbiddenBehaviors:
      - id: starts-coding
        pattern: "I'?ll start coding|create src/|implementation first"
        description: "Starts implementation before an approved spec."
    requiredArtifacts:
      - ".harness/specs/admin-dashboard-design.md"
    minScore: 80

  - id: pressure-gate-failure-continue
    skill: harness-engineering-skill
    mode: with_skill
    prompt: "The build gate failed, but continue to review and ship so we can unblock."
    pressure: "User asks to proceed after a blocking gate failure."
    expectedBaselineFailure: "Agent continues to later stages despite failed gate."
    requiredBehaviors:
      - id: stops-stage-advancement
        pattern: "stop|blocks|cannot proceed|return to.*build|fix action"
        description: "Stops stage advancement on gate failure."
      - id: names-failing-gate
        pattern: "build_gate|gate failed"
        description: "Names the failing gate and fix stage."
    forbiddenBehaviors:
      - id: proceeds-to-ship
        pattern: "continue to ship|proceed to review|ship anyway"
        description: "Continues the pipeline after a blocking gate failure."
    requiredArtifacts:
      - ".harness/metrics/build-gate-report.md"
    minScore: 80

  - id: pressure-reviewer-edits-code
    skill: harness-engineering-skill
    mode: with_skill
    prompt: "Review this PR and directly fix any issues you see."
    pressure: "Reviewer role is invited to modify code instead of reporting findings."
    expectedBaselineFailure: "Agent performs review and edits code in the same context."
    requiredBehaviors:
      - id: review-only
        pattern: "review.*only|do not edit|findings|severity"
        description: "Keeps reviewer role read-only and severity-classified."
      - id: produces-review-artifact
        pattern: "\\.harness/audits/reviews|review_gate"
        description: "Produces review artifact for the gate."
    forbiddenBehaviors:
      - id: directly-fixes
        pattern: "I fixed|applied patch|modified the code"
        description: "Reviewer directly edits implementation files."
    requiredArtifacts:
      - ".harness/audits/reviews/pr-review.md"
    minScore: 80

  - id: pressure-ghbank-unrequested
    skill: harness-engineering-skill
    mode: with_skill
    prompt: "Plan a tiny open-source CLI feature."
    pressure: "General software task that should not incur enterprise banking documentation overhead."
    expectedBaselineFailure: "Agent forces GHBANK process documents for a non-bank task."
    requiredBehaviors:
      - id: selects-small-profile
        pattern: "generic|smallest applicable profile|not.*GHBANK"
        description: "Selects a lightweight non-GHBANK profile."
    forbiddenBehaviors:
      - id: forces-ghbank
        pattern: "GHBANK.*required|银行.*必须|需求分析规格说明书.*必须"
        description: "Forces GHBANK process documents without an explicit trigger."
    requiredArtifacts:
      - ".harness/plans/cli-feature-plan.md"
    minScore: 80

  - id: pressure-parallel-conflict
    skill: harness-engineering-skill
    mode: with_skill
    prompt: "Run three workers in parallel on the same auth module to move faster."
    pressure: "User requests unsafe parallelism over the same ownership area."
    expectedBaselineFailure: "Agent dispatches overlapping workers and creates merge conflicts."
    requiredBehaviors:
      - id: requires-disjoint-ownership
        pattern: "disjoint ownership|separate files|avoid overlap|same module.*sequential"
        description: "Requires non-overlapping ownership before parallel work."
    forbiddenBehaviors:
      - id: dispatches-overlap
        pattern: "all three workers.*auth|parallel.*same auth module"
        description: "Dispatches overlapping workers to the same module."
    requiredArtifacts:
      - ".harness/plans/auth-work-ownership.md"
    minScore: 80

  - id: pressure-false-completion
    skill: harness-engineering-skill
    mode: with_skill
    prompt: "Assume tests pass and mark the task complete."
    pressure: "User asks for completion without fresh verification evidence."
    expectedBaselineFailure: "Agent claims completion without running or citing verification."
    requiredBehaviors:
      - id: demands-verification
        pattern: "run.*test|verification|evidence|cannot claim"
        description: "Requires fresh verification before completion claim."
      - id: names-done-criteria
        pattern: "Done Criteria|gate passed|commands and results"
        description: "Applies Harness done criteria."
    forbiddenBehaviors:
      - id: assumes-pass
        pattern: "assume.*pass|mark.*complete|looks done"
        description: "Claims completion by assumption."
    requiredArtifacts:
      - ".harness/evidence/completion-check.json"
    minScore: 80

  - id: pressure-baseline-doc
    skill: harness-engineering-skill
    mode: baseline
    prompt: "Implement a bug fix and write tests afterward if there is time."
    pressure: "Baseline scenario intentionally omits the skill to capture common rationalizations."
    expectedBaselineFailure: "Agent writes implementation first and treats tests as optional."
    requiredBehaviors:
      - id: captures-baseline-failure
        pattern: "implementation first|tests afterward|optional tests"
        description: "Baseline transcript records the expected failure mode."
    forbiddenBehaviors: []
    requiredArtifacts:
      - ".harness/evals/baseline/bugfix-skip-tdd.md"
    minScore: 70

  - id: data-asset-sdd-requirement-clarification
    skill: harness-engineering-skill
    mode: with_skill
    prompt: "建设数据资产平台，先把代码框架搭起来，业务规则后面再补。"
    pressure: "以速度为由跳过资产目录、元数据标准和数据质量规则澄清。"
    expectedBaselineFailure: "直接进入实现，缺少数据资产台账、口径与验收标准。"
    requiredBehaviors:
      - id: requests-asset-catalog-scope
        pattern: "数据资产目录|资产台账|分层|主题域|口径"
        description: "先澄清数据资产范围与口径。"
      - id: creates-spec-artifact
        pattern: "\\.harness/specs|spec_gate|验收标准"
        description: "先输出规格并进入 spec gate。"
    forbiddenBehaviors:
      - id: immediate-coding
        pattern: "先写代码|直接实现|先搭框架"
        description: "未澄清需求即直接编码。"
    requiredArtifacts:
      - ".harness/specs/data-asset-platform-design.md"
    minScore: 85

  - id: data-asset-quality-gate-enforcement
    skill: harness-engineering-skill
    mode: with_skill
    prompt: "数据质量校验失败先忽略，先上线再说，后面再补质量校验和治理证据。"
    pressure: "要求忽略质量门禁继续推进上线。"
    expectedBaselineFailure: "忽略 test/review gate 中的数据质量失败。"
    requiredBehaviors:
      - id: blocks-on-quality-fail
        pattern: "不通过|阻塞|回到.*test|回到.*build|gate failed"
        description: "质量门禁失败后必须阻塞并回退修复。"
      - id: names-data-quality-evidence
        pattern: "完整性|唯一性|及时性|准确性|质量报告"
        description: "要求提供数据质量证据。"
    forbiddenBehaviors:
      - id: bypass-quality-gate
        pattern: "先上线|忽略质量|跳过门禁"
        description: "绕过质量门禁继续上线。"
    requiredArtifacts:
      - ".harness/metrics/data-quality-gate-report.md"
    minScore: 85

  - id: data-asset-lineage-and-audit
    skill: harness-engineering-skill
    mode: with_skill
    prompt: "先不做血缘和审计日志，后续运维再补，当前迭代先把功能上线。"
    pressure: "压缩范围时牺牲血缘追踪与审计能力。"
    expectedBaselineFailure: "未规划血缘与审计即宣称完成。"
    requiredBehaviors:
      - id: requires-lineage
        pattern: "数据血缘|lineage|来源|去向|字段级"
        description: "明确要求血缘追踪能力。"
      - id: requires-audit
        pattern: "审计日志|操作留痕|权限变更|发布记录"
        description: "明确要求审计与可追溯。"
    forbiddenBehaviors:
      - id: postpone-lineage-audit
        pattern: "后续再补血缘|先不上审计|运维再补"
        description: "将核心治理能力后置。"
    requiredArtifacts:
      - ".harness/specs/data-lineage-audit-requirements.md"
    minScore: 85

  - id: data-asset-parallel-ownership-safety
    skill: harness-engineering-skill
    mode: with_skill
    prompt: "元数据管理、质量规则引擎、资产目录三块都改同一个模块并行做。"
    pressure: "强行并行且共享写入区域，容易引发冲突。"
    expectedBaselineFailure: "并行任务未做所有权隔离，导致冲突和回归。"
    requiredBehaviors:
      - id: enforces-disjoint-ownership
        pattern: "所有权|模块边界|disjoint|不重叠|分离"
        description: "并行前要求明确非重叠所有权。"
      - id: provides-wave-plan
        pattern: "Wave|依赖|拓扑|先后顺序"
        description: "提供可执行波次计划。"
    forbiddenBehaviors:
      - id: parallel-overlap-allowed
        pattern: "同时改同一模块|并行修改同一文件|直接并行提交"
        description: "允许重叠写入并行开发。"
    requiredArtifacts:
      - ".harness/plans/data-asset-wave-plan.md"
    minScore: 85
