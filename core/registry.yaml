        name: "流水线编排"
        action: "定义 CI/CD 阶段（lint→test→build→scan→deploy），配置触发条件和并行策略"
      - step: 2
        name: "环境管理"
        action: "搭建 dev/staging/prod 多环境，管理环境变量和密钥注入"
      - step: 3
        name: "部署自动化"
        action: "配置蓝绿部署/金丝雀发布/回滚机制，集成部署后健康检查"
    file_path: "core/skills/ship/ci-cd-pipeline/SKILL.md"

  containerization:
