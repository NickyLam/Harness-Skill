# === 变更追踪（来自 component-registry.yaml）===
change_tracking:
  enabled: true
  mechanism: "git"
  commit_format: "feat(harness): <component_class> — <change_description>"
  require_prediction: true
  prediction_template: |
    ## 变更预测
    **组件类**: <component_class>
    **变更文件**: <file_path>
    **变更内容**: <what_changed>
    **预期效果**: <predicted_impact>
    **验证方式**: <how_to_verify>
    **验证轮次**: 下一轮 /harness <stage> 执行时自动验证

rollback:
  enabled: true
  mechanism: "git revert"
  trigger: "预测验证失败 / Gate 通过率下降 / 下一轮任务失败率上升"
