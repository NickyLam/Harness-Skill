# Web React Template — React + TypeScript + Vite

> **模板 ID**: web-react
> **版本**: 2.2.0 (2026-05-05 更新)
> **适用场景**: 标准 React Web 应用（SPA）

## 技术栈

```yaml
language: typescript
framework: react
build_tool: vite
package_manager: npm
test_runner: vitest
linter: eslint  # 推荐使用 ESLint (v8.57+)，避免 biome 兼容性问题
styling: tailwind_css
```

## ⚠️ 模块系统规范 (ESM/CJS 统一)

> **重要**: 本模板使用 **ESM (ES Modules)** 作为默认模块系统。

### 文件扩展名约定

| 扩展名 | 模块系统 | 用途 | 示例文件 |
|--------|----------|------|----------|
| `.ts` / `.tsx` | **ESM** | 源代码 (默认) | `src/hooks/useAuth.ts` |
| `.js` / `.jsx` | **ESM** | ESM 脚本 (当 package.json 有 `"type": "module"`) | `vite.config.ts` |
| `.cjs` | **CJS** | CommonJS 配置文件 (Node.js 兼容) | `tailwind.config.cjs`, `.eslintrc.cjs` |
| `.mjs` | **ESM** | 显式 ESM 脚本 | - |
| `.d.ts` | **类型声明** | TypeScript 声明文件 | 自动生成 |

### 必须使用 CJS 的配置文件

以下文件**必须**使用 `.cjs` 扩展名（因为它们被 Node.js 直接 require）：

```bash
tailwind.config.cjs    # TailwindCSS 配置
.eslintrc.cjs         # ESLint 配置
postcss.config.cjs    # PostCSS 配置
jest.config.cjs       # Jest 配置 (如使用)
babel.config.cjs      # Babel 配置 (如使用)
```

### 可以使用 ESM 的配置文件

```bash
tsconfig.json          # TypeScript (JSON 格式，无模块问题)
vite.config.ts         # Vite (原生支持 ESM)
vitest.config.ts       # Vitest (原生支持 ESM)
package.json           # NPM 包配置
```

### package.json 关键配置

```json
{
  "type": "module",
  "scripts": {
    "build": "tsc -b && vite build"
  }
}
```

## 项目约定

### 文件结构
```
project-root/
├── src/
│   ├── components/          # UI 组件 (PascalCase)
│   │   └── {ComponentName}.tsx
│   ├── hooks/               # 自定义 Hooks (use{Purpose})
│   │   └── use{HookName}.ts
│   ├── utils/               # 工具函数 (camelCase)
│   │   └── {utilName}.ts
│   ├── types/               # TypeScript 类型定义
│   │   └── index.ts        # 统一导出
│   ├── __tests__/           # 测试文件
│   │   ├── config/          # 配置测试
│   │   ├── hooks/           # Hook 测试
│   │   ├── utils/           # 工具函数测试
│   │   ├── mocks/           # Mock 数据 & Factory
│   │   └── utils/
│   │       └── test-utils.tsx  # 自定义 render + 路径工具
│   ├── App.tsx              # 根组件
│   ├── main.tsx             # 入口
│   └── vite-env.d.ts        # Vite 类型声明
├── .harness/                # Harness 工作目录
├── index.html               # HTML 入口
├── package.json             # NPM 配置 (type: module)
├── tsconfig.json            # TS 配置 (含路径别名)
├── tsconfig.app.json        # TS App 配置
├── tsconfig.node.json       # TS Node 配置
├── vite.config.ts           # Vite 配置
├── tailwind.config.cjs      # TW 配置 (**必须 .cjs**)
├── .eslintrc.cjs            # ESLint 配置 (**必须 .cjs**)
└── db.json                  # Mock 数据库 (如使用 JSON Server)
```

### 命名规范
| 类型 | 规范 | 示例 |
|------|------|------|
| 组件 | PascalCase | `TodoList`, `TodoItem` |
| Hook | camelCase + use 前缀 | `useTodos`, `useFilter` |
| 工具函数 | camelCase | `formatDate`, `generateId` |
| 类型接口 | PascalCase | `TodoType`, `FilterType` (无需后缀) |
| 常量 | UPPER_SNAKE_CASE | `MAX_TODOS`, `API_BASE_URL` |
| 测试文件 | `{name}.test.{ts,tsx}` | `TodoList.test.tsx` |
| CSS 类名 | kebab-case | `todo-item`, `filter-btn` |

