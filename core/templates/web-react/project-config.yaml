## 🛡️ Pre-Execution Safety Gate

### 触发时机

Pre-Execution Gate **必须在以下时机触发用户确认**：

```
1. Wave 开始前 (推荐)          → 确认任务列表和风险评估
2. 危险操作前 (删除/权限变更)   → 二次确认
3. 外部 API 调用前              → 确认网络和数据安全
```

### Gate 检查清单

```markdown
## 🛡️ Pre-Execution Checklist

### 安全检查
- [ ] 是否涉及数据删除操作？
- [ ] 是否涉及权限变更？
- [ ] 是否有外部 API 调用？
- [ ] 是否有敏感数据处理？

### 环境检查
- [ ] 依赖是否已安装？(node_modules 存在)
- [ ] Mock Server 是否启动？(如需要)
- [ ] 环境变量是否配置？

### 数据备份
- [ ] 重要数据是否已备份？
- [ ] Git 是否已提交当前进度？（便于回滚）
```

### 实现代码示例

```typescript
// 在 orchestrator 或 Task 执行器中
async function preExecutionGate(task: Task): Promise<boolean> {
  const checks = [
    task.type === 'delete' ? '⚠️ 删除操作' : null,
    task.requiresNetwork ? '🌐 网络请求' : null,
  ].filter(Boolean);

  if (checks.length > 0) {
    console.log('\n🛡️ PRE-EXECUTION SAFETY GATE');
    console.log(`Task: ${task.name}`);
    console.log('Warnings:', checks.join(', '));
    
    // MCP 强制交互点 - 等待用户确认
    const confirmed = await askUserConfirmation(
      `是否继续执行任务 "${task.name}"？`,
      ['✅ 确认执行', '❌ 取消', '⏭️ 跳过']
    );
    
    return confirmed === '✅ 确认执行';
  }
  
  return true;
}
```

## 🧪 异步测试标准模式

### Hook 测试模板 (useXxx)

```typescript
import { describe, it, expect, vi, beforeEach } from 'vitest';
import { renderHook, waitFor } from '@testing-library/react';
import { useXxx } from '@/hooks/useXxx';

// Mock fetch/API
const mockFetch = vi.fn();
global.fetch = mockFetch;

describe('useXxx Hook', () => {
  beforeEach(() => {
    mockFetch.mockReset();
    vi.clearAllMocks();
    localStorage.clear();  // 如涉及 auth
  });

  it('should handle async data fetching', async () => {
    // 1. 准备 mock 数据
    const mockData = [{ id: '1', name: 'Test' }];
    mockFetch.mockResolvedValueOnce({
      ok: true,
      json: async () => mockData,
    });

    // 2. 渲染 hook
    const { result } = renderHook(() => useXxx());

    // 3. 使用 waitFor 等待异步状态更新
    await waitFor(() => {
      expect(result.current.loading).toBe(false);
    }, { timeout: 5000 });  // ← 注意：timeout 必须是对象格式

    // 4. 断言结果
    expect(result.current.data).toEqual(mockData);
    expect(result.current.error).toBeNull();
  });

  it('should handle errors gracefully', async () => {
    mockFetch.mockRejectedValueOnce(new Error('Network Error'));

    const { result } = renderHook(() => useXxx());

    await waitFor(() => {
      expect(result.current.error).toBeTruthy();
    });
  });
});
```

### 关键注意事项

1. **始终使用 `waitFor()`** 而非 `waitForNextUpdate()`
2. **timeout 参数格式**: `{ timeout: 5000 }` (对象格式)
3. **清理工作**: 在 `beforeEach` 中重置所有 mocks
4. **避免 act() 警告**: 将状态更新包裹在 `waitFor` 中

